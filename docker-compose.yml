services:
  postgres:
    image: postgres:16-alpine
    container_name: printshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-printadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-printshop}
    volumes:
      - /home/pepe/printshop-data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - printshop_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-printadmin} -d ${DB_NAME:-printshop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: printshop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - /home/pepe/printshop-data/redis:/data
    networks:
      - printshop_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: printshop-api
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    volumes:
      - /home/pepe/printshop-data/catalog-models:/data/catalog
      - /home/pepe/printshop-data/customer-uploads:/data/uploads
      - /home/pepe/printshop-data/gcode-output:/data/gcode:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    networks:
      - printshop_internal

  slicer-worker:
    build:
      context: .
      dockerfile: apps/slicer-worker/Dockerfile
    container_name: printshop-slicer
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    volumes:
      - /home/pepe/printshop-data/customer-uploads:/data/uploads:ro
      - /home/pepe/printshop-data/gcode-output:/data/gcode
    depends_on:
      - redis
      - postgres
    networks:
      - printshop_internal
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: printshop-web
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - api
    networks:
      - printshop_internal

networks:
  printshop_internal:
    driver: bridge
